  hidden: true
- p: [19, 20]
  k: $$mdi:apple-keyboard-command$$
- p: [20, 21]
  k: $$mdi:apple-keyboard-option$$
- p: [19, 20, 21]
  k: ⌘⌥
  a: top
  hidden: true
- p: [36, 37]
  k: $$tabler:progress-down$$
  l: [sym]
- p: [41, 40]
  k: $$tabler:progress-down$$
  l: [num]
